<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memories</title>
  <script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Picker overlay ── */
    .picker-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .picker-card {
      background: #fff; border-radius: 8px; padding: 24px; min-width: 320px;
      box-shadow: 0 4px 24px rgba(0,0,0,.2);
    }
    .picker-card h2 { margin-bottom: 16px; }
    .picker-card button {
      display: block; width: 100%; text-align: left;
      padding: 10px 14px; margin-bottom: 8px;
      border: 1px solid #ddd; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 14px;
    }
    .picker-card button:hover { background: #f0f4ff; }

    /* ── Main layout: 3-column grid ── */
    .layout {
      display: grid;
      grid-template-columns: 50% 25% 25%;
      flex: 1;
      overflow: hidden;
    }

    /* ── Chat panel ── */
    .chat-panel {
      display: flex; flex-direction: column;
      border-right: 1px solid #ddd;
      min-width: 0;
      overflow: hidden;
    }
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd;
      font-weight: 600;
    }
    .chat-messages {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 16px;
    }
    .chat-messages-inner {
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; }
    .msg.user  { align-self: flex-end; background: #3b5bdb; color: #fff; border-radius: 12px 12px 2px 12px; }
    .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #ddd; border-radius: 12px 12px 12px 2px; }
    .msg.generating { color: #888; font-style: italic; }
    .msg.contradiction-exhausted { border-color: #faa; }
    .msg.journal {
      align-self: flex-start; max-width: 70%;
      background: #f7f3ea; border: 1px dashed #c9b97a;
      border-radius: 12px 12px 12px 2px;
      font-style: italic; color: #5a4e2d;
    }
    .msg.journal .journal-header {
      font-size: 11px; font-style: normal; font-weight: 600;
      color: #8a7440; margin-bottom: 6px; letter-spacing: 0.03em;
    }

    .thinking-block {
      align-self: flex-start; max-width: 70%;
      border: 1px solid #e8e0f8; border-radius: 8px; overflow: hidden;
    }
    .thinking-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px; background: #f3eeff;
      font-size: 12px; color: #7c5cbf; font-weight: 500; cursor: pointer;
      user-select: none;
    }
    .thinking-header:hover { background: #ebe3ff; }
    .thinking-body {
      padding: 10px 12px; background: #faf8ff;
      font-size: 12px; color: #555; font-style: italic; line-height: 1.6;
      white-space: pre-wrap; max-height: 200px; overflow-y: auto;
    }

    /* ── Notification cards ── */
    .notification-card {
      align-self: flex-start; max-width: 70%;
      border-radius: 8px; overflow: hidden;
      border: 1px solid #ddd;
      font-size: 13px;
    }
    .notification-title {
      padding: 8px 12px; font-weight: 600; font-size: 12px;
    }
    .notification-body { padding: 0 12px 10px; }
    .notification-card.inference { border-color: #40a080; }
    .notification-card.inference .notification-title { background: #eefff8; color: #006040; }
    .notification-card.contradiction { border-color: #f04040; }
    .notification-card.contradiction .notification-title { background: #fff0ee; color: #a00000; }
    .notification-card.fact-fluid { border-color: #40a0c0; }
    .notification-card.fact-fluid .notification-title { background: #eef8ff; color: #106080; }
    .notification-card.fact-mutable { border-color: #f0a040; }
    .notification-card.fact-mutable .notification-title { background: #fff8ee; color: #a05000; }
    .notification-card.fact-immutable { border-color: #8060c0; }
    .notification-card.fact-immutable .notification-title { background: #f3eeff; color: #503090; }

    .violation-desc { color: #555; margin: 8px 0 4px; line-height: 1.4; }
    .violation-fact { margin: 4px 0 8px; }
    .violation-fact label { font-size: 12px; color: #888; display: block; margin-bottom: 2px; }
    .violation-fact .fact-key-display {
      font-family: monospace; background: #f5f5f5; padding: 3px 6px;
      border-radius: 3px; margin-right: 4px; font-size: 12px;
    }
    .violation-fact input {
      padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px;
      font-size: 13px; width: 100%; margin-top: 4px;
    }
    .violation-fact input:focus { outline: none; border-color: #3b5bdb; }

    .inference-statement { font-weight: 500; margin: 8px 0 2px; }
    .inference-derivation { color: #777; font-size: 12px; font-style: italic; margin-bottom: 8px; }

    .notification-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .btn-accept {
      padding: 4px 12px; background: #2f9e44; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .btn-accept:hover { background: #237032; }
    .btn-accept:disabled { background: #aaa; cursor: default; }
    .btn-ignore {
      padding: 4px 12px; background: #fff; color: #555;
      border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .btn-ignore:hover { background: #f5f5f5; }
    .btn-ignore:disabled { opacity: .5; cursor: default; }

    .chat-input-row {
      display: flex; gap: 8px; padding: 12px 16px; align-items: flex-end;
      background: #fff; border-top: 1px solid #ddd;
    }
    .chat-input-row textarea {
      flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
      resize: none; overflow-y: hidden; line-height: 1.5;
      min-height: 36px; max-height: 200px; overflow-y: auto;
      field-sizing: content;
      font-family: inherit;
    }
    .chat-input-row textarea:focus { outline: none; border-color: #3b5bdb; }
    .chat-input-row button {
      padding: 8px 18px; background: #3b5bdb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
      flex-shrink: 0;
    }
    .chat-input-row button:disabled { background: #aaa; cursor: default; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-end.loading::after {
      content: ''; display: inline-block; width: 10px; height: 10px;
      border: 2px solid #c55; border-top-color: transparent;
      border-radius: 50%; margin-left: 6px; vertical-align: middle;
      animation: spin .7s linear infinite;
    }

    .think-toggle {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 13px; color: #555;
      white-space: nowrap; user-select: none;
    }
    .think-toggle.active {
      border-color: #7c5cbf; background: #f3eeff; color: #7c5cbf;
    }
    .think-toggle input[type="checkbox"] { display: none; }

    /* ── Facts panel ── */
    .facts-panel {
      display: flex; flex-direction: column;
      background: #fff; min-width: 0;
      border-right: 1px solid #ddd;
      overflow: hidden;
    }

    /* ── Side panel (column 3: inferences + experiences) ── */
    .side-panel {
      display: flex; flex-direction: column;
      background: #fff; min-width: 0;
      overflow: hidden;
    }
    .facts-header {
      padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #ddd;
    }
    .facts-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px; }

    /* Schema-driven fact tree */
    .fact-group {
      font-weight: 600; font-size: 13px; cursor: pointer;
      padding: 4px 0; user-select: none; color: #444;
    }
    .fact-group:hover { color: #3b5bdb; }
    .fact-group > span { display: inline-block; width: 12px; color: #888; }
    .fact-leaf {
      display: flex; align-items: center; gap: 6px; margin: 3px 0;
    }
    .fact-leaf-name { font-size: 13px; min-width: 84px; word-break: break-word; color: #555; }
    .fact-leaf input, .fact-leaf select {
      flex: 1; min-width: 0; padding: 3px 7px;
      border: 1px solid #ddd; border-radius: 4px; font-size: 13px; background: #fff;
    }
    .fact-leaf input:focus, .fact-leaf select:focus { outline: none; border-color: #3b5bdb; }

    /* ── Inferences section (top of side panel) ── */
    .inferences-section {
      flex: 1 1 auto; min-height: 50%;
      overflow-y: auto; padding: 8px 16px;
    }
    .inferences-header { font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #555; }

    /* ── Experiences section (bottom of side panel) ── */
    .experiences-section {
      flex: 0 0 auto; max-height: 50%;
      overflow-y: auto; padding: 8px 16px;
      border-top: 1px solid #ddd;
    }
    .experiences-header { font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #555; }
    .experience-row {
      display: flex; align-items: flex-start; gap: 5px;
      margin-bottom: 7px; font-size: 13px; line-height: 1.4;
    }
    .exp-dot { font-size: 9px; margin-top: 3px; flex-shrink: 0; }
    .exp-dot.active  { color: #3b5bdb; }
    .exp-dot.inactive { color: #ccc; }
    .exp-source {
      font-size: 10px; font-weight: 700; padding: 1px 4px;
      border-radius: 3px; flex-shrink: 0; margin-top: 2px;
    }
    .exp-source.told-by-user { background: #e8f0ff; color: #3b5bdb; }
    .exp-source.observed     { background: #f5f5f5; color: #666; }
    .exp-statement { flex: 1; }
    .exp-delete {
      background: none; border: none; cursor: pointer;
      color: #bbb; font-size: 12px; flex-shrink: 0; padding: 0 2px;
    }
    .exp-delete:hover { color: #c00; }
    .experience-proposal {
      background: #f8f9ff; border: 1px solid #dde;
      border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px;
    }
    .experience-proposal textarea {
      width: 100%; margin-top: 4px; padding: 4px 6px;
      border: 1px solid #bbd; border-radius: 4px; font-size: 13px;
      font-family: inherit; resize: vertical; min-height: 48px;
    }
    .experience-proposal textarea:focus { outline: none; border-color: #3b5bdb; }
    .exp-proposal-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .exp-review-loading { color: #888; font-size: 13px; font-style: italic; padding: 4px 0; }
    .inference-row { margin-bottom: 8px; }
    .inference-row-top { display: flex; align-items: flex-start; gap: 4px; }
    .inference-row-statement {
      flex: 1; font-size: 13px; cursor: pointer; line-height: 1.4;
    }
    .inference-row-statement:hover { color: #3b5bdb; }
    .inference-row-derivation { font-size: 12px; color: #888; font-style: italic; margin: 3px 0 0 24px; }
    .inference-type-badge {
      font-size: 11px; padding: 1px 5px; border-radius: 3px;
      font-weight: 600; margin-right: 4px;
    }
    .inference-type-badge.logical { background: #e8f4fd; color: #0066cc; }
    .inference-type-badge.probabilistic { background: #eefff8; color: #006040; }

    .facts-footer { padding: 12px 16px; border-top: 1px solid #ddd; }
    .btn-end {
      width: 100%; padding: 7px; background: #fff; color: #c00;
      border: 1px solid #faa; border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    .btn-end:hover { background: #fdd; }
    .btn-end:disabled { opacity: .5; cursor: default; }
    .btn-new-session {
      width: 100%; padding: 7px; background: #3b5bdb; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    .btn-new-session:hover:not(:disabled) { background: #2f4cc0; }
    .btn-new-session:disabled { background: #aaa; cursor: default; }
    .session-ended-label {
      text-align: center; font-size: 12px; color: #888; margin-bottom: 6px;
    }

    .error-msg { color: #c00; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
<div id="app">

  <!-- Character picker -->
  <div v-if="showPicker" class="picker-overlay">
    <div class="picker-card">
      <h2>Choose a character</h2>
      <button v-for="ch in characters" :key="ch.id" @click="pickCharacter(ch)">
        {{ ch.name }} <small style="color:#888">({{ ch.modelfile_base }})</small>
      </button>
      <p v-if="characters.length === 0" style="color:#888">No characters found.</p>
    </div>
  </div>

  <!-- Main UI -->
  <div v-else class="layout">

    <!-- Chat -->
    <div class="chat-panel">
      <div class="chat-header">
        <span>{{ currentCharacter?.name ?? 'Chat' }}</span>
        <span style="font-size:18px;cursor:pointer" title="Session ended" v-if="sessionEnded">🔒</span>
      </div>
      <div class="chat-messages" ref="messagesEl">
        <div class="chat-messages-inner">
        <template v-for="(msg, i) in messages" :key="i">

          <!-- Previous-session journal reflection -->
          <div v-if="msg.role === 'journal'" class="msg journal">
            <div class="journal-header">💭 {{ msg.name }}'s thoughts before this session</div>
            {{ msg.content }}
          </div>

          <!-- Thinking block -->
          <div v-else-if="msg.role === 'thinking'" class="thinking-block">
            <div class="thinking-header" @click="msg._open = !msg._open">
              <span>&#129504; Thinking</span>
              <span>{{ msg._open ? '▲' : '▼' }}</span>
            </div>
            <div v-if="msg._open" class="thinking-body">{{ msg.content }}</div>
          </div>

          <!-- User / assistant messages -->
          <div v-else-if="msg.role === 'user' || msg.role === 'assistant'"
               :class="['msg', msg.role, msg.contradictionExhausted ? 'contradiction-exhausted' : '']">
            {{ msg.content }}
            <div v-if="msg.contradictionExhausted"
                 style="font-size:11px;color:#c55;margin-top:4px">
              ⚠ Max contradiction retries reached — response may not be fully grounded.
            </div>
          </div>

          <!-- Contradiction notification (informational) -->
          <div v-else-if="msg.role === 'notification' && msg.scType === 'contradiction'"
               class="notification-card contradiction">
            <div class="notification-title">⚡ Contradiction detected (attempt {{ msg.iteration }}) — response regenerated</div>
            <div class="notification-body">
              <p class="violation-desc">{{ msg.description }}</p>
              <div class="notification-actions">
                <button class="btn-ignore" @click="dismissNotification(msg)">Dismiss</button>
              </div>
            </div>
          </div>

          <!-- Fluid fact update (quiet, applied already) -->
          <div v-else-if="msg.role === 'notification' && msg.scType === 'fact_update_fluid'"
               class="notification-card fact-fluid">
            <div class="notification-title">💧 {{ msg.path }} updated: {{ msg.value }}</div>
            <div class="notification-body">
              <div class="notification-actions">
                <button class="btn-ignore" @click="dismissNotification(msg)">Dismiss</button>
              </div>
            </div>
          </div>

          <!-- Mutable fact update (blocking; accept / edit / reject) -->
          <div v-else-if="msg.role === 'notification' && msg.scType === 'fact_update_mutable'"
               class="notification-card fact-mutable">
            <div class="notification-title">📌 Character implied a change — {{ msg.path }}</div>
            <div class="notification-body">
              <p class="violation-desc">Proposed value: <strong>{{ msg.proposed }}</strong></p>
              <div class="violation-fact">
                <label>Value</label>
                <select v-if="leafType(msg.path) === 'Enum'" v-model="msg._editValue">
                  <option v-for="c in leafConstraint(msg.path)" :key="c" :value="c">{{ c }}</option>
                </select>
                <input v-else :type="leafType(msg.path) === 'Integer' ? 'number' : 'text'"
                       v-model="msg._editValue" />
              </div>
              <div class="notification-actions">
                <button class="btn-accept" :disabled="msg._loading" @click="resolveMutable(msg, 'accept')">
                  {{ msg._loading ? 'Working…' : 'Accept' }}
                </button>
                <button class="btn-accept" :disabled="msg._loading" @click="resolveMutable(msg, 'edit')">
                  Save edit
                </button>
                <button class="btn-ignore" :disabled="msg._loading" @click="resolveMutable(msg, 'reject')">
                  Reject
                </button>
              </div>
            </div>
          </div>

          <!-- Immutable-unset fact update (blocking; accept / edit / dismiss) -->
          <div v-else-if="msg.role === 'notification' && msg.scType === 'fact_update_immutable_unset'"
               class="notification-card fact-immutable">
            <div class="notification-title">🔒 Set a permanent value — {{ msg.path }}</div>
            <div class="notification-body">
              <p class="violation-desc">Character used: <strong>{{ msg.proposed }}</strong>
                (locks permanently once set)</p>
              <div class="violation-fact">
                <label>Value</label>
                <select v-if="leafType(msg.path) === 'Enum'" v-model="msg._editValue">
                  <option v-for="c in leafConstraint(msg.path)" :key="c" :value="c">{{ c }}</option>
                </select>
                <input v-else :type="leafType(msg.path) === 'Integer' ? 'number' : 'text'"
                       v-model="msg._editValue" />
              </div>
              <div class="notification-actions">
                <button class="btn-accept" :disabled="msg._loading" @click="resolveImmutable(msg, 'accept')">
                  {{ msg._loading ? 'Working…' : 'Accept' }}
                </button>
                <button class="btn-accept" :disabled="msg._loading" @click="resolveImmutable(msg, 'edit')">
                  Save edit
                </button>
                <button class="btn-ignore" :disabled="msg._loading" @click="resolveImmutable(msg, 'dismiss')">
                  Dismiss
                </button>
              </div>
            </div>
          </div>

          <!-- Require-fact gate (blocking; confirm / dismiss) -->
          <div v-else-if="msg.role === 'notification' && msg.scType === 'require_fact'"
               class="notification-card fact-immutable">
            <div class="notification-title">❓ The character needs a value — {{ msg.path }}</div>
            <div class="notification-body">
              <p class="violation-desc">{{ msg.reason }}</p>
              <div class="violation-fact">
                <label>Value</label>
                <select v-if="leafType(msg.path) === 'Enum'" v-model="msg._editValue">
                  <option v-for="c in leafConstraint(msg.path)" :key="c" :value="c">{{ c }}</option>
                </select>
                <input v-else :type="leafType(msg.path) === 'Integer' ? 'number' : 'text'"
                       v-model="msg._editValue" />
              </div>
              <div class="notification-actions">
                <button class="btn-accept" :disabled="msg._loading" @click="resolveRequireFact(msg, true)">
                  {{ msg._loading ? 'Working…' : 'Confirm' }}
                </button>
                <button class="btn-ignore" :disabled="msg._loading" @click="resolveRequireFact(msg, false)">
                  Not now
                </button>
              </div>
            </div>
          </div>

          <!-- Inference proposed (quiet, dismissible) -->
          <div v-else-if="msg.role === 'notification' && msg.scType === 'inference_proposed'"
               class="notification-card inference">
            <div class="notification-title">💡 New inference</div>
            <div class="notification-body">
              <p class="inference-statement">{{ msg.inference.statement }}</p>
              <p class="inference-derivation">{{ msg.inference.derivation }}</p>
              <div class="notification-actions">
                <button class="btn-ignore" @click="dismissNotification(msg)">Dismiss</button>
              </div>
            </div>
          </div>

        </template>

        <div v-if="generating" class="msg generating">{{ statusText || 'Thinking…' }}</div>
        </div>
      </div>
      <div class="chat-input-row">
        <textarea
          v-model="inputText"
          placeholder="Type a message…"
          :disabled="sending || sessionEnded"
          @keydown.enter.exact.prevent="sendMessage"
          ref="inputEl"
          rows="1"
        ></textarea>
        <label :class="['think-toggle', { active: thinkEnabled }]" title="Toggle model thinking">
          <input type="checkbox" v-model="thinkEnabled" />
          &#129504; Think
        </label>
        <button :disabled="sending || sessionEnded || !inputText.trim()" @click="sendMessage">
          {{ sending ? '…' : 'Send' }}
        </button>
      </div>
    </div>

    <!-- Facts sidebar -->
    <div class="facts-panel">
      <div class="facts-header">Facts</div>
      <div class="facts-list">
        <template v-for="row in visibleFactRows" :key="row.path">
          <div v-if="!row.isLeaf" class="fact-group"
               :style="{ paddingLeft: (row.depth * 12) + 'px' }"
               @click="toggleGroup(row.path)">
            <span>{{ collapsedGroups.has(row.path) ? '▸' : '▾' }}</span> {{ row.name }}
          </div>
          <div v-else class="fact-leaf" :style="{ paddingLeft: (row.depth * 12) + 'px' }">
            <span class="fact-leaf-name" :title="row.description">{{ row.name }}</span>
            <select v-if="row.type === 'Enum'"
                    v-model="leafEdits[row.path]"
                    @change="saveLeaf(row)">
              <option v-for="c in row.constraint" :key="c" :value="c">{{ c }}</option>
            </select>
            <input v-else
                   :type="row.type === 'Integer' ? 'number' : 'text'"
                   v-model="leafEdits[row.path]"
                   @keyup.enter="saveLeaf(row)"
                   @blur="saveLeaf(row)"
                   placeholder="(not set)" />
          </div>
        </template>
        <p v-if="visibleFactRows.length === 0" style="color:#aaa;font-size:13px">
          Loading schema…
        </p>
      </div>

      <div class="facts-footer">
        <button :class="['btn-end', { loading: reviewingSession }]"
                v-if="!sessionEnded"
                :disabled="generating || reviewingSession"
                @click="endSession">
          {{ reviewingSession ? 'Reviewing session' : 'End Session' }}
        </button>
        <div v-else>
          <p class="session-ended-label">Session ended</p>
          <button class="btn-new-session"
                  :disabled="reviewingSession || sessionProposals.length > 0"
                  @click="newSession">New Session</button>
        </div>
      </div>
    </div>

    <!-- Column 3: Inferences + Experiences -->
    <div class="side-panel">

      <!-- Inferences pane -->
      <div class="inferences-section">
        <div v-if="inferences.length > 0">
          <div class="inferences-header">Inferences</div>
          <div v-for="inf in inferences" :key="inf.id" class="inference-row">
            <div class="inference-row-top">
              <span class="inference-row-statement" @click="inf._expanded = !inf._expanded">
                <span class="inference-type-badge" :class="inf.inference_type">{{ inf.inference_type }}</span>{{ inf.statement }}
              </span>
              <button class="exp-delete" @click.stop="deleteInference(inf)" title="Delete">✕</button>
            </div>
            <div v-if="inf._expanded" class="inference-row-derivation">{{ inf.derivation }}</div>
          </div>
        </div>
        <p v-else style="color:#aaa;font-size:13px;padding-top:4px">No inferences yet.</p>
      </div>

      <!-- Experiences pane -->
      <div v-if="reviewingSession || sessionProposals.length > 0 || experiences.length > 0"
           class="experiences-section">
        <div class="experiences-header">Experiences</div>

        <!-- Loading state while session-end LLM call is in flight -->
        <p v-if="reviewingSession" class="exp-review-loading">Reviewing session…</p>

        <!-- Proposal review cards -->
        <template v-else-if="sessionProposals.length > 0">
          <div v-for="(p, i) in sessionProposals" :key="i" class="experience-proposal">
            <span :class="['exp-source', p.source === 'told_by_user' ? 'told-by-user' : 'observed']">
              {{ p.source === 'told_by_user' ? 'user' : 'obs' }}
            </span>
            <textarea v-if="p._editing" v-model="p._editStatement"></textarea>
            <div v-else class="exp-statement" style="margin-top:4px">{{ p.statement }}</div>
            <div class="exp-proposal-actions">
              <button class="btn-accept" :disabled="p._loading" @click="acceptProposal(p)">
                {{ p._loading ? 'Saving…' : 'Accept' }}
              </button>
              <button v-if="!p._editing" class="btn-ignore" :disabled="p._loading"
                      @click="p._editing = true; p._editStatement = p.statement">
                Edit
              </button>
              <button v-else class="btn-accept" :disabled="p._loading || !p._editStatement.trim()"
                      @click="confirmEditProposal(p)">
                {{ p._loading ? 'Saving…' : 'Confirm' }}
              </button>
              <button class="btn-ignore" :disabled="p._loading" @click="discardProposal(i)">
                Discard
              </button>
            </div>
          </div>
        </template>

        <!-- Approved experiences list -->
        <template v-else>
          <div v-for="exp in sortedExperiences" :key="exp.id" class="experience-row">
            <span :class="['exp-dot', activeExperienceIds.has(exp.id) ? 'active' : 'inactive']">
              {{ activeExperienceIds.has(exp.id) ? '●' : '○' }}
            </span>
            <span :class="['exp-source', exp.source === 'told_by_user' ? 'told-by-user' : 'observed']">
              {{ exp.source === 'told_by_user' ? 'user' : 'obs' }}
            </span>
            <span class="exp-statement">{{ exp.statement }}</span>
            <button class="exp-delete" @click="deleteExperience(exp)" title="Delete">✕</button>
          </div>
          <p v-if="experiences.length === 0" style="color:#aaa;font-size:13px">No experiences yet.</p>
        </template>
      </div>

    </div>

  </div>
</div>

<script type="module">
import { createApp } from 'vue';
import { ChatComponent } from './chat-component.js';
createApp(ChatComponent).mount('#app');
</script>
</body>
</html>
